{% extends "base.html" %}
{% block body_class %}bare{% endblock %}
{% block title %}Change Password — {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="card" style="max-width:420px;margin:0 auto;">
  <h2 style="margin:0 0 6px;">Change Password</h2>
  <p class="muted" style="margin:0 0 20px;font-size:.9rem;">
    You must set a new password before continuing.
  </p>

  <form method="post" novalidate>
    {% csrf_token %}

    <label for="password1">New password</label>
    <input type="password" name="password1" id="password1"
           required autocomplete="new-password" minlength="8" autofocus>

    <label for="password2">Confirm new password</label>
    <input type="password" name="password2" id="password2"
           required autocomplete="new-password" minlength="8">

    <div style="margin-top:22px;">
      <button type="submit" class="btn-primary" style="width:100%;">Save password</button>
    </div>
  </form>
</div>
{% endblock %}
