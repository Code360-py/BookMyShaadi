{% extends "base.html" %}
{% block body_class %}has-tabbar{% endblock %}
{% block tabbar %}{% include "accounts/partials/tabbar.html" %}{% endblock %}
{% block title %}Change password — {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="card" style="max-width:520px;margin:0 auto;">
  <h2 style="margin:0 0 12px;">Change password</h2>
  <form method="post" novalidate>
    {% csrf_token %}
    <label for="old_password">Current password</label>
    <input type="password" name="old_password" id="old_password" required autocomplete="current-password">

    <label for="new_password1">New password</label>
    <input type="password" name="new_password1" id="new_password1" required autocomplete="new-password" minlength="8">

    <label for="new_password2">Confirm new password</label>
    <input type="password" name="new_password2" id="new_password2" required autocomplete="new-password" minlength="8">

    <div class="row" style="margin-top:20px;gap:12px;">
      <button type="submit" class="btn-primary">Change password</button>
      <a href="{% url 'accounts:dashboard' %}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
